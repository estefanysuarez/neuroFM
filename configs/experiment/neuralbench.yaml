# @package _global_
name: neuralbench
mode: experiment
handoff: neurofm
objective: classify

defaults:
  - override /data: synthetic
  - override /model: nb_biot

model:
  n_chans: 4
  n_outputs: 2
  sfreq: 200
  from_pretrained: true

data:
  temporal_transforms: [bandpass]

training:
  n_epochs: 2
  batch_size: 4
  learning_rate: 0.0001